services:
  worker:
    image: ${DOCKERHUB_USERNAME:-plogrid}/plogrid-ai:latest
    build: .
    restart: unless-stopped
    volumes:
      - ./models:/app/models
    environment:
      - YOLO_MODEL_DIR=/app/models
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - REDIS_CONSUMER_NAME=${REDIS_CONSUMER_NAME:?REDIS_CONSUMER_NAME must be set}